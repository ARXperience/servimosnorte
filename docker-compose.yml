version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: servimos_db
    restart: always
    environment:
      POSTGRES_DB: servimos_norte
      POSTGRES_USER: servimos_admin
      POSTGRES_PASSWORD: servimos_secret_2024
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
